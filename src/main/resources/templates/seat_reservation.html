<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>PujankeAir - seat reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/navbar.css}" rel="stylesheet">
    <link th:href="@{/css/text_style.css}" rel="stylesheet">
    <link th:href="@{/css/seatmap.css}" rel="stylesheet">
</head>

<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<th:block th:replace="~{fragments/error_message :: error_message}"></th:block>
<th:block th:replace="~{fragments/success_message :: success_message}"></th:block>

<div class="container my-4"
     th:with="rows=${seatConfig.seatRowCount},
              cols=${seatConfig.seatColumnCount},
              leftCols=${(cols + 1) / 2},
              rightCols=${cols - leftCols}">

    <div class="card shadow-sm">
        <div class="card-body py-3">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
                <div>
                    <div class="fw-semibold">Seat selection</div>
                </div>

                <div class="d-flex align-items-center gap-3 small">
                    <span class="seatmap-legend">
                        <span class="seatmap-legend-dot seatmap-legend-free"></span>
                        Free
                    </span>
                    <span class="seatmap-legend">
                        <span class="seatmap-legend-dot seatmap-legend-reserved"></span>
                        Reserved
                    </span>
                </div>
            </div>

            <form id="seatForm"
                  th:action="@{/flights/{flightId}/ticket(flightId=${flightId})}"
                  method="post"
                  th:attr="data-flight-id=${flightId},data-poll-url=@{/api/flights/seat-config/{flightId}(flightId=${flightId})}">

                <input type="hidden" name="seatId" id="seatIdInput" value="">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="seatmap-wrap">
                    <table class="seatmap-table">
                        <thead>
                        <tr>
                            <th class="seatmap-rowhdr text-muted small"></th>

                            <th th:each="c : ${#numbers.sequence(0, leftCols - 1)}"
                                class="seatmap-colhdr text-muted small"
                                th:text="${T(com.air.pujanke.model.custom.Seat).indexToColumnChar(c)}"></th>

                            <th class="seatmap-aisle"></th>

                            <th th:each="c : ${#numbers.sequence(leftCols, cols - 1)}"
                                class="seatmap-colhdr text-muted small"
                                th:text="${T(com.air.pujanke.model.custom.Seat).indexToColumnChar(c)}"></th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="r : ${#numbers.sequence(1, rows)}" th:attr="data-row=${r}">
                            <th class="seatmap-rowhdr text-muted small" th:text="${r}"></th>

                            <td th:each="c : ${#numbers.sequence(0, leftCols - 1)}"
                                th:with="colChar=${T(com.air.pujanke.model.custom.Seat).indexToColumnChar(c)},
                                         seatObj=${new com.air.pujanke.model.custom.Seat(r, colChar)},
                                         isTaken=${#lists.contains(seatConfig.takenSeats, seatObj)},
                                         seatId=|${r}${colChar}|"
                                th:class="|seatmap-seat ${isTaken ? 'seatmap-seat-reserved' : 'seatmap-seat-free'}|"
                                th:attr="data-seat-id=${seatId},data-reserved=${isTaken},aria-disabled=${isTaken}"
                                >
                            </td>

                            <td class="seatmap-aisle"></td>

                            <td th:each="c : ${#numbers.sequence(leftCols, cols - 1)}"
                                th:with="colChar=${T(com.air.pujanke.model.custom.Seat).indexToColumnChar(c)},
                                         seatObj=${new com.air.pujanke.model.custom.Seat(r, colChar)},
                                         isTaken=${#lists.contains(seatConfig.takenSeats, seatObj)},
                                         seatId=|${r}${colChar}|"
                                th:class="|seatmap-seat ${isTaken ? 'seatmap-seat-reserved' : 'seatmap-seat-free'}|"
                                th:attr="data-seat-id=${seatId},data-reserved=${isTaken},aria-disabled=${isTaken}"
                                >
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="text-muted small mt-3">
                    Click a free seat to reserve it (<span style="color:red">costs 1.25x the base fare</span>), <br>or have a random one assigned to you.
                </div>
            </form>

            <form th:action="@{/flights/{flightId}/ticket/random(flightId=${flightId})}" method="post" class="mt-3 text-center">
                <meta name="_csrf" th:content="${_csrf.token}">
                <meta name="_csrf_header" th:content="${_csrf.headerName}">
                <button type="submit" class="btn btn-outline-primary">Reserve Random Seat</button>
            </form>

        </div>
    </div>

</div>

<script th:src="@{/js/seatmap.js}" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

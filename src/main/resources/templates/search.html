<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PujankeAir - search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/navbar.css}" rel="stylesheet">
    <link th:href="@{/css/text_style.css}" rel="stylesheet">
    <link th:href="@{/css/search_results.css}" rel="stylesheet">
    <script th:src="@{/js/search_sort.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<th:block th:replace="~{fragments/error_message :: error_message}"></th:block>
<th:block th:replace="~{fragments/success_message :: success_message}"></th:block>

<div class="container my-4">
    <div class="card shadow-sm mx-auto" style="max-width: 720px;">
        <div class="card-body py-3">
            <form th:action="@{/search}" method="get" th:object="${flightSearch}" id="searchForm">
                <input type="hidden" name="page" id="page" th:value="${param.page != null ? param.page[0] : 0}">
                <input type="hidden" name="sort" id="sortPrimary" value="">
                <input type="hidden" name="sort" id="sortSecondary" value="" disabled>

                <div class="row g-2">

                    <div class="col-md-6">
                        <label for="originAirportIcao" class="form-label small mb-1">Origin</label>
                        <select id="originAirportIcao" class="form-select form-select-sm" th:field="*{originAirportIcao}">
                            <option value="">Select origin</option>
                            <option th:each="airport : ${airports}" th:value="${airport.icaoCode}" th:text="|${airport.icaoCode} ${airport.airportName}, ${airport.city.cityName}|"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="destinationAirportIcao" class="form-label small mb-1">Destination</label>
                        <select id="destinationAirportIcao" class="form-select form-select-sm" th:field="*{destinationAirportIcao}">
                            <option value="">Select destination</option>
                            <option th:each="airport : ${airports}" th:value="${airport.icaoCode}" th:text="|${airport.icaoCode} ${airport.airportName}, ${airport.city.cityName}|"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="takeoffDate" class="form-label small mb-1">Departure</label>
                        <input id="takeoffDate" type="date" class="form-control form-control-sm" th:field="*{takeoffDate}">
                    </div>

                    <div class="col-md-4">
                        <label for="baseFareLesserThan" class="form-label small mb-1">Max fare</label>
                        <input id="baseFareLesserThan" type="number" class="form-control form-control-sm" step="0.01" min="0" max="1000000" th:field="*{baseFareLesserThan}">
                    </div>

                    <div class="col-md-4">
                        <label for="size" class="form-label small mb-1">Page size</label>
                        <select id="size" name="size" class="form-select form-select-sm">
                            <option value="5"
                                    th:selected="${(param.size != null ? param.size[0] : (flights != null ? '' + flights.size : '10')) == '5'}">5</option>
                            <option value="10"
                                    th:selected="${(param.size != null ? param.size[0] : (flights != null ? '' + flights.size : '10')) == '10'}">10</option>
                            <option value="15"
                                    th:selected="${(param.size != null ? param.size[0] : (flights != null ? '' + flights.size : '10')) == '15'}">15</option>
                            <option value="20"
                                    th:selected="${(param.size != null ? param.size[0] : (flights != null ? '' + flights.size : '10')) == '20'}">20</option>
                        </select>
                    </div>

                    <div class="col-12 mt-2">
                        <div class="d-flex flex-wrap gap-3 align-items-center">
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <span class="small text-muted">Sort by</span>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="sortBy" id="sortByFare" value="fare"
                                           th:checked="${param.sort == null || (param.sort.size() >= 1 && param.sort[0].startsWith('baseFare,'))}">
                                    <label class="form-check-label small" for="sortByFare">Base fare</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="sortBy" id="sortByTime" value="time"
                                           th:checked="${param.sort != null && param.sort.size() == 2 && param.sort[0].startsWith('takeoffDate,') && param.sort[1].startsWith('takeoffTime,')}">
                                    <label class="form-check-label small" for="sortByTime">Takeoff time</label>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <span class="small text-muted">Order</span>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="sortDir" id="sortDirAsc" value="asc"
                                           th:checked="${param.sort == null || (param.sort.size() >= 1 && param.sort[0].endsWith(',asc'))}">
                                    <label class="form-check-label small" for="sortDirAsc">↑</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="sortDir" id="sortDirDesc" value="desc"
                                           th:checked="${param.sort != null && param.sort.size() >= 1 && param.sort[0].endsWith(',desc')}">
                                    <label class="form-check-label small" for="sortDirDesc">↓</label>
                                </div>
                            </div>

                            <div class="ms-auto d-flex gap-2">
                                <button type="submit" class="btn btn-sm btn-primary px-4">Search</button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12" th:if="${flights != null}">
                        <div class="text-muted small mt-2" th:if="${flights.totalElements > 0}"
                             th:text="'Results: ' + ${flights.totalElements} + ' • Page ' + ${flights.number + 1} + ' of ' + ${flights.totalPages}">
                        </div>
                        <div class="text-muted small mt-2" th:if="${flights.totalElements == 0}">
                            No matching flights found.
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>

<div class="container my-4" th:if="${flights != null}">

    <div class="d-flex flex-column gap-2" th:if="${flights.totalElements > 0}">
        <div class="card shadow-sm flight-card" th:each="f : ${flights.content}">
            <div class="card-body py-3">
                <div class="d-flex flex-column flex-md-row justify-content-between gap-3">

                    <div class="flex-grow-1">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                            <span class="badge text-bg-secondary"
                                  th:text="|${#temporals.format(f.takeoffDate, 'dd.MM.yyyy.')} • ${f.takeoffTime}|">
                            </span>
                        </div>

                        <div class="flight-route">
                            <div class="flight-airport">
                                <div class="flight-icao" th:text="${f.originAirportIcao != null ? f.originAirportIcao : 'none'}"></div>
                                <div class="flight-name text-muted" th:text="${f.originAirportName != null ? f.originAirportName : 'none'}"></div>
                                <div class="flight-city small text-muted" th:text="${f.originAirportCityName != null ? f.originAirportCityName : ''}"></div>
                            </div>

                            <div class="flight-arrow text-muted">→</div>

                            <div class="flight-airport">
                                <div class="flight-icao" th:text="${f.destinationAirportIcao != null ? f.destinationAirportIcao : 'none'}"></div>
                                <div class="flight-name text-muted" th:text="${f.destinationAirportName != null ? f.destinationAirportName : 'none'}"></div>
                                <div class="flight-city small text-muted" th:text="${f.destinationAirportCityName != null ? f.destinationAirportCityName : ''}"></div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-column justify-content-between align-items-md-end gap-2">
                        <div class="text-end">
                            <div class="text-muted small">Base fare</div>
                            <div class="fs-5 fw-semibold"
                                 th:text="${f.baseFare != null ? (#numbers.formatDecimal(f.baseFare, 1, 'COMMA', 2, 'POINT')) : 'none'}">
                            </div>
                        </div>

                        <a class="btn btn-sm btn-primary px-4" th:href="@{/flights/{flightId}(flightId=${f.flightId})}">Reserve</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <nav th:if="${flights.totalPages > 1}" aria-label="Search results pages" class="mt-3">
        <ul class="pagination pagination-sm justify-content-center mb-0">

            <li class="page-item" th:classappend="${flights.first} ? 'disabled'">
                <a class="page-link"
                   th:if="${param.sort != null && param.sort.size() == 2}"
                   th:href="@{/search(originAirportIcao=${flightSearch.originAirportIcao},
                                      destinationAirportIcao=${flightSearch.destinationAirportIcao},
                                      takeoffDate=${flightSearch.takeoffDate},
                                      baseFareLesserThan=${flightSearch.baseFareLesserThan},
                                      page=${flights.number - 1},
                                      size=${flights.size},
                                      sort=${param.sort[0]},
                                      sort=${param.sort[1]})}">
                    Prev
                </a>
                <a class="page-link"
                   th:unless="${param.sort != null && param.sort.size() == 2}"
                   th:href="@{/search(originAirportIcao=${flightSearch.originAirportIcao},
                                      destinationAirportIcao=${flightSearch.destinationAirportIcao},
                                      takeoffDate=${flightSearch.takeoffDate},
                                      baseFareLesserThan=${flightSearch.baseFareLesserThan},
                                      page=${flights.number - 1},
                                      size=${flights.size},
                                      sort=${param.sort == null ? 'baseFare,asc' : param.sort[0]})}">
                    Prev
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, flights.totalPages - 1)}"
                th:classappend="${i == flights.number} ? 'active'">
                <a class="page-link"
                   th:if="${param.sort != null && param.sort.size() == 2}"
                   th:text="${i + 1}"
                   th:href="@{/search(originAirportIcao=${flightSearch.originAirportIcao},
                                      destinationAirportIcao=${flightSearch.destinationAirportIcao},
                                      takeoffDate=${flightSearch.takeoffDate},
                                      baseFareLesserThan=${flightSearch.baseFareLesserThan},
                                      page=${i},
                                      size=${flights.size},
                                      sort=${param.sort[0]},
                                      sort=${param.sort[1]})}">
                </a>
                <a class="page-link"
                   th:unless="${param.sort != null && param.sort.size() == 2}"
                   th:text="${i + 1}"
                   th:href="@{/search(originAirportIcao=${flightSearch.originAirportIcao},
                                      destinationAirportIcao=${flightSearch.destinationAirportIcao},
                                      takeoffDate=${flightSearch.takeoffDate},
                                      baseFareLesserThan=${flightSearch.baseFareLesserThan},
                                      page=${i},
                                      size=${flights.size},
                                      sort=${param.sort == null ? 'baseFare,asc' : param.sort[0]})}">
                </a>
            </li>

            <li class="page-item" th:classappend="${flights.last} ? 'disabled'">
                <a class="page-link"
                   th:if="${param.sort != null && param.sort.size() == 2}"
                   th:href="@{/search(originAirportIcao=${flightSearch.originAirportIcao},
                                      destinationAirportIcao=${flightSearch.destinationAirportIcao},
                                      takeoffDate=${flightSearch.takeoffDate},
                                      baseFareLesserThan=${flightSearch.baseFareLesserThan},
                                      page=${flights.number + 1},
                                      size=${flights.size},
                                      sort=${param.sort[0]},
                                      sort=${param.sort[1]})}">
                    Next
                </a>
                <a class="page-link"
                   th:unless="${param.sort != null && param.sort.size() == 2}"
                   th:href="@{/search(originAirportIcao=${flightSearch.originAirportIcao},
                                      destinationAirportIcao=${flightSearch.destinationAirportIcao},
                                      takeoffDate=${flightSearch.takeoffDate},
                                      baseFareLesserThan=${flightSearch.baseFareLesserThan},
                                      page=${flights.number + 1},
                                      size=${flights.size},
                                      sort=${param.sort == null ? 'baseFare,asc' : param.sort[0]})}">
                    Next
                </a>
            </li>

        </ul>
    </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PujankeAir (admin) - flights</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/navbar.css}" rel="stylesheet">
    <link th:href="@{/css/text_style.css}" rel="stylesheet">
    <link th:href="@{/css/flight_admin.css}" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<th:block th:replace="~{fragments/error_message :: error_message}"></th:block>
<th:block th:replace="~{fragments/success_message :: success_message}"></th:block>

<div class="container my-5 admin-flights">
    <div class="card shadow-sm mb-4">
        <div class="card-header d-flex align-items-center justify-content-between">
            <div class="fw-semibold">Flights</div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped align-middle mb-0">
                <thead class="table-primary">
                <tr>
                    <th class="text-nowrap">Flight ID</th>
                    <th class="text-nowrap">Aircraft</th>
                    <th class="text-nowrap">Pilot</th>
                    <th class="text-nowrap">Origin</th>
                    <th class="text-nowrap">Destination</th>
                    <th class="text-nowrap">Takeoff date</th>
                    <th class="text-nowrap">Takeoff time</th>
                    <th class="text-nowrap text-end">Base fare</th>
                    <th class="text-nowrap text-end">Duration</th>
                    <th class="text-nowrap text-center"></th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="flight : ${flights}">
                    <td th:text="${flight.flightId != null ? flight.flightId : 'none'}"></td>
                    <td th:text="${flight.aircraft != null ? flight.aircraft.aircraftId + ', ' + flight.aircraft.manufacturerName + ' ' + flight.aircraft.modelName : 'none'}"></td>
                    <td th:text="${flight.pilot != null ? flight.pilot.rank + '. ' + flight.pilot.fullName + ', ' + flight.pilot.pin : 'none'}"></td>
                    <td th:text="${flight.takeoffAirport != null ? flight.takeoffAirport.icaoCode + ' ' + flight.takeoffAirport.airportName : 'none'}"></td>
                    <td th:text="${flight.destinationAirport != null ? flight.destinationAirport.icaoCode + ' ' + flight.destinationAirport.airportName : 'none'}"></td>
                    <td class="text-nowrap" th:text="${flight.takeoffDate != null ? #temporals.format(flight.takeoffDate, 'dd.MM.yyyy.') : 'none'}"></td>
                    <td class="text-nowrap" th:text="${flight.takeoffTime != null ? flight.takeoffTime : 'none'}"></td>
                    <td class="text-end" th:text="${flight.baseFare != null ? flight.baseFare : 'none'}"></td>
                    <td class="text-end text-nowrap" th:text="${flight.estimatedDurationMinutes != null ? flight.estimatedDurationMinutes + ' min' : 'none'}"></td>
                    <td class="text-center">
                        <div class="d-inline-flex gap-2">
                            <form method="get" th:action="@{/admin/flights/{flightId}(flightId=${flight.flightId})}">
                                <button type="submit" class="btn btn-primary btn-sm">Edit</button>
                            </form>
                            <form method="post" th:action="@{/admin/flights/{flightId}(flightId=${flight.flightId})}">
                                <input type="hidden" name="_method" value="delete"/>
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header fw-semibold">Add flight</div>
        <div class="card-body">
            <form method="post" th:object="${flightForm}" th:action="@{/admin/flights}" class="row g-3 align-items-end">

                <div class="col-12 col-lg-3">
                    <label class="form-label">Aircraft</label>
                    <select th:field="*{aircraftId}" class="form-select">
                        <option th:each="aircraft : ${aircrafts}" th:value="${aircraft.aircraftId}"
                                th:text="|${aircraft.aircraftId}, ${aircraft.manufacturerName} ${aircraft.modelName}|"></option>
                    </select>
                </div>

                <div class="col-12 col-lg-3">
                    <label class="form-label">Pilot</label>
                    <select th:field="*{pilotPin}" class="form-select">
                        <option th:each="pilot : ${pilots}" th:value="${pilot.pin}"
                                th:text="|${pilot.rank}. ${pilot.fullName}, ${pilot.pin}|"></option>
                    </select>
                </div>

                <div class="col-12 col-lg-3">
                    <label class="form-label">Origin</label>
                    <select th:field="*{takeoffAirportIcao}" class="form-select">
                        <option th:each="airport : ${airports}" th:value="${airport.icaoCode}"
                                th:text="|${airport.icaoCode} ${airport.airportName}|"></option>
                    </select>
                </div>

                <div class="col-12 col-lg-3">
                    <label class="form-label">Destination</label>
                    <select th:field="*{destinationAirportIcao}" class="form-select">
                        <option th:each="airport : ${airports}" th:value="${airport.icaoCode}"
                                th:text="|${airport.icaoCode} ${airport.airportName}|"></option>
                    </select>
                </div>

                <div class="col-12 col-md-3 col-lg-2">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" th:field="*{takeoffDate}">
                </div>

                <div class="col-12 col-md-3 col-lg-2">
                    <label class="form-label">Time</label>
                    <input type="time" class="form-control" th:field="*{takeoffTime}">
                </div>

                <div class="col-12 col-md-3 col-lg-2">
                    <label class="form-label">Base fare</label>
                    <input type="number" min="0" max="1000000" step="0.01"
                           class="form-control text-end" th:field="*{baseFare}" placeholder="0.00">
                </div>

                <div class="col-12 col-md-3 col-lg-2">
                    <label class="form-label">Duration (min)</label>
                    <input type="number" min="0" step="1" max="10000"
                           class="form-control text-end" th:field="*{estimatedDurationMinutes}" placeholder="0">
                </div>

                <div class="col-12 col-lg-2 ms-auto">
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>

            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
